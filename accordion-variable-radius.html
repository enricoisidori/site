<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CGIL — Accordion a raggio variabile</title>
<style>*{box-sizing:border-box}body{margin:0;background:#141414;color:#f1f1ed;font-family:Helvetica,Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:30px}svg{width:min(1100px,96vw);height:auto;overflow:visible}.label{font-size:11px;fill:#f1f1ed}.percent{font-size:12px;fill:#f1f1ed}</style>
</head>
<body><main><svg id="accordion" viewBox="0 0 1200 800" role="img" aria-label="Diagramma accordion a raggio variabile"></svg></main>
<script>
'use strict';
const svg=document.getElementById('accordion'),ns='http://www.w3.org/2000/svg',labels=['Riduzione dell’orario di lavoro','Statuto dei lavoratori','Ferie retribuite','Diritto di sciopero','Tutele sulla salute e sicurezza','Diritto alla formazione','Pensioni e tutele previdenziali','Contrattazione collettiva'],weights=[78,2,18,8,52,1,4,17],relations=[[0,3,68],[0,4,57],[0,7,28],[1,2,4],[1,3,3],[1,6,1],[2,4,21],[2,6,5],[3,4,14],[3,7,6],[4,5,3],[5,6,1],[6,7,7],[0,2,13],[1,5,1]],cx=600,cy=400,unit=Math.PI*2/8,gap=.055,total=weights.reduce((a,b)=>a+b,0);
const make=(name,attrs,parent=svg)=>{const el=document.createElementNS(ns,name);Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));parent.append(el);return el},point=(radius,angle)=>({x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius}),arc=(radius,start,end)=>{const b=point(radius,end);return `A ${radius} ${radius} 0 0 1 ${b.x} ${b.y}`};
make('rect',{width:1200,height:800,fill:'#141414'});const construction=make('g',{fill:'none',stroke:'#f1f1ed',opacity:.3});[80,120,160,200,240].forEach((radius,index)=>make('circle',{cx,cy,r:radius,'stroke-width':.55,'stroke-dasharray':index===4?'2 4':'2 7'},construction));
const sectors=weights.map((weight,index)=>{const start=-Math.PI/2+unit*index+gap,end=-Math.PI/2+unit*(index+1)-gap,angle=(start+end)/2,radius=118+weight/78*122,band=8+weight/78*30;return {index,weight,start,end,angle,radius,band}}),anchors=sectors.map(s=>point(s.radius-s.band/2,s.angle));
const links=make('g',{id:'connections',fill:'none',stroke:'#f1f1ed'});relations.forEach(([from,to,weight],index)=>{const a=anchors[from],b=anchors[to],length=Math.hypot(a.x-b.x,a.y-b.y)||1,bend=(index%2?1:-1)*(15+(index%4)*9),mx=cx+(a.x+b.x-2*cx)*.08,my=cy+(a.y+b.y-2*cy)*.08;make('path',{d:`M ${a.x} ${a.y} Q ${mx-bend*(a.y-b.y)/length} ${my+bend*(a.x-b.x)/length} ${b.x} ${b.y}`,'stroke-width':(.25+weight*.048).toFixed(2),opacity:Math.min(.86,.12+weight*.016).toFixed(2)},links)});
const shapes=make('g',{id:'sectors',fill:'none',stroke:'#f1f1ed'});sectors.forEach(s=>{const group=make('g',{id:`sector-${s.index}`},shapes),radius=s.radius-s.band/2;make('path',{d:`M ${point(radius,s.start).x} ${point(radius,s.start).y} ${arc(radius,s.start,s.end)}`,'stroke-width':s.band},group);make('path',{d:`M ${point(s.radius-18,s.start).x} ${point(s.radius-18,s.start).y} ${arc(s.radius-18,s.start,s.end)}`,'stroke-width':.75,opacity:.72},group);for(let tick=0;tick<=6;tick++){const angle=s.start+(s.end-s.start)*tick/6,major=tick===0||tick===6||tick%2===0,p1=point(major?s.radius-s.band-5:s.radius-s.band/2,angle),p2=point(s.radius+6,angle);make('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,'stroke-width':major?1:.55},group)}});
const textLayer=make('g',{id:'labels'});sectors.forEach(s=>{const percent=point(s.radius+25,s.angle),labelPoint=point(s.radius+60,s.angle),cos=Math.cos(s.angle),anchor=cos>.28?'start':cos<-.28?'end':'middle';const p=make('text',{x:percent.x,y:percent.y,'text-anchor':'middle','dominant-baseline':'middle',class:'percent'},textLayer);p.textContent=`${Math.round(s.weight/total*100)}%`;const label=make('text',{x:labelPoint.x,y:labelPoint.y,'text-anchor':anchor,'dominant-baseline':'middle',class:'label'},textLayer);label.textContent=labels[s.index]});
</script></body></html>

<script>
// Page and video relay live on Cloudflare (same origin); this frame keeps the address.
const frame=document.querySelector('iframe');if(location.search)frame.src='https://blueness.blueness-pages.workers.dev/'+location.search;
frame.addEventListener('load',()=>frame.focus());
// Shared by the screen and the on-demand video overlay. No font downloads.
function layoutBluenessIntro(svg,width,height,size,screen={x:0,y:0,w:width,h:height},unit=1){
 const direct=[...svg.children].filter(node=>node.tagName?.toLowerCase()==='path');
 if(!svg.querySelector('[data-intro-text]')&&direct.length>=3){
  const text=document.createElementNS(svg.namespaceURI,'g'),arrow=document.createElementNS(svg.namespaceURI,'g');text.dataset.introText='1';arrow.dataset.introArrow='1';
  svg.insertBefore(text,direct[0]);text.append(direct[0]);svg.insertBefore(arrow,direct[1]);arrow.append(direct[1],direct[2]);
 }
 if(!svg.querySelector('[data-blue-anchor]'))svg.querySelector('rect:last-of-type')?.setAttribute('data-blue-anchor','1');
 const anchor=svg.querySelector('[data-blue-anchor]'),text=svg.querySelector('[data-intro-text]'),arrow=svg.querySelector('[data-intro-arrow]');if(!anchor||!text||!arrow)return;
 const cx=screen.x+screen.w/2,cy=screen.y+screen.h/2,gap=16*unit,margin=Math.max(16*unit,Math.min(48*unit,screen.w*.05));
 const a=anchor.getBBox(),t=text.getBBox(),r=arrow.getBBox();
 const arrowHeight=Math.max(44*unit,Math.min(100*unit,Math.min(screen.w,screen.h)*.12)),arrowScale=arrowHeight/r.height,arrowTop=cy-size/2-gap-arrowHeight;
 const textScale=Math.max(.01,Math.min((screen.w-2*margin)/t.width,(arrowTop-screen.y-margin-gap)/t.height));
 svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('width',width);svg.setAttribute('height',height);
 svg.style.cssText=`position:absolute;display:block;left:0;top:0;width:${width}px;height:${height}px;max-width:none;max-height:none;`;
 anchor.setAttribute('transform',`translate(${cx-(a.x+a.width/2)*size/a.width} ${cy-(a.y+a.height/2)*size/a.width}) scale(${size/a.width})`);
 arrow.setAttribute('transform',`translate(${cx-(r.x+r.width/2)*arrowScale} ${arrowTop-r.y*arrowScale}) scale(${arrowScale})`);
 text.setAttribute('transform',`translate(${cx-(t.x+t.width/2)*textScale} ${arrowTop-gap-(t.y+t.height)*textScale}) scale(${textScale})`);
}

// Same SVG and geometry as the page (default 50 px square), visible at once.
const wait=document.getElementById('wait'),svg=wait.querySelector('svg');
const place=()=>layoutBluenessIntro(svg,innerWidth,innerHeight,50);place();addEventListener('resize',place);
// Last resort only: if the page is still not ready after 1.5 s, a light sweeps
// across the SVG, like a loading shimmer (3 s per pass, intensity 80, band 40:
// chosen in demo-attesa.html). A normal load never shows it.
let shimmering=false;
const shimmer=setTimeout(()=>{shimmering=true;
 const ns='http://www.w3.org/2000/svg',defs=document.createElementNS(ns,'defs');
 defs.innerHTML='<linearGradient id="blueness-wait" x1="0" x2="1" y1="0" y2="0" gradientTransform="translate(-1 0)"><stop offset="0" stop-color="#0700FF"/><stop offset=".1" stop-color="#0700FF"/><stop offset=".5" stop-color="#cdccff"/><stop offset=".9" stop-color="#0700FF"/><stop offset="1" stop-color="#0700FF"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/></linearGradient>';
 svg.prepend(defs);for(const shape of svg.querySelectorAll('path,rect'))shape.setAttribute('fill','url(#blueness-wait)');
},1500);
// The page signals its first burst frame: it now shows the same SVG itself.
addEventListener('message',event=>{
 if(event.origin!==new URL('https://blueness.blueness-pages.workers.dev/').origin||event.data!=='blueness:ready')return;
 clearTimeout(shimmer);if(!shimmering){wait.remove();return;}
 // The shimmer does not stop abruptly: from where it is, the band runs off to the right fast.
 const gradient=svg.querySelector('#blueness-wait'),loop=gradient.querySelector('animateTransform');
 // The loop is timed from the SVG document start (begin=0), so its phase is time mod 3 s.
 const at=-1+2*((svg.getCurrentTime()%3)/3);loop.remove();gradient.setAttribute('gradientTransform','translate('+at+' 0)');
 const exit=document.createElementNS('http://www.w3.org/2000/svg','animateTransform');
 for(const [k,v] of [['attributeName','gradientTransform'],['type','translate'],['from',at+' 0'],['to','1 0'],['dur','0.25s'],['fill','freeze'],['begin','indefinite']])exit.setAttribute(k,v);
 gradient.append(exit);exit.beginElement();setTimeout(()=>wait.remove(),260);
});

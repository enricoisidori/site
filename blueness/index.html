let sequence = 0;
function jsonp(url, signal) {
  const target = new URL(url);
  if (target.origin !== 'https://archive.org' || target.pathname !== '/advancedsearch.php') throw new Error('invalid JSONP endpoint');
  return new Promise((resolve, reject) => {
    const name = '__archive' + Date.now() + '_' + (++sequence);
    const script = document.createElement('script');
    let timer, settled = false;
    const finish = (error, data) => {
      if (settled) return; settled = true;
      clearTimeout(timer); signal?.removeEventListener('abort', abort); script.remove();

    };
    const abort = () => finish(signal.reason || new DOMException('aborted', 'AbortError'));
    if (signal?.aborted) return abort();
    window[name] = data => data.error ? finish(new Error(String(data.error))) : finish(null, data);
    script.onerror = () => finish(new Error('ricerca Archive non disponibile'));
    target.searchParams.set('callback', name); script.src = target.href;
    signal?.addEventListener('abort', abort, { once: true });
    timer = setTimeout(() => finish(new Error('timeout ricerca Archive')), 8000);
    document.head.append(script);

}
async function direct(url, signal) {
  const response = await fetch(url, { signal: AbortSignal.any([signal || new AbortController().signal, AbortSignal.timeout(10000)]) });
  if (!response.ok) throw new Error('Archive HTTP ' + response.status);
  const data = await response.json();
  if (data.error) throw new Error(String(data.error));
  return data;
}
async function archiveJSON(url, signal) {

  // file:// sends Origin:null; avoid the known failing fetch before JSONP.
  if (!search || location.protocol !== 'file:') {
    try { return await direct(url, signal); }
    catch (failure) { if (signal?.aborted) throw failure; error = failure; }
  }
  if (!search) throw error;
  try { return await jsonp(url, signal); }
  catch (failure) { if (signal?.aborted) throw failure; error = failure; }
  const original = new URL(url);
  const params = new URLSearchParams({ q: original.searchParams.get('q'), fields: 'identifier,title', count: '100' });
  const sort = original.searchParams.get('sort[]'); if (sort) params.set('sorts', sort);
  if (original.searchParams.get('rows') === '1') params.set('total_only', 'true');

    const data = await direct('https://archive.org/services/search/v1/scrape?' + params, signal);
    if (data.total == null) throw new Error('risposta Archive incompleta');
    // Recovery still applies the full query; randomness is limited to this batch.
    return { response: { numFound: Number(data.total), docs: data.items || [] }, recovery: true };
  } catch (failure) {
    if (signal?.aborted) throw failure;
    throw new Error('ricerca Archive non disponibile: ' + (failure.message || error.message));

}

 if(!infoVisible)return;info.replaceChildren();const p=document.createElement('p');p.textContent=`${mode} · ${checked} analisi · ${accepted} match · ${shown} mostrati\n${Object.entries(pools).map(([k,v])=>k+': '+v.ready.length+' pronti').join(' · ')}\n${current?.match?Math.round(current.match.ratio*100)+'% nel range blu · zoom '+current.match.zoom.toFixed(2)+'× · area sorgente '+current.match.side+' px':'ricerca in corso'}${lastError?'\nultimo errore: '+lastError:''}`;info.append(p);

}
function screens(){if(!settings.dual)return[{x:0,y:0,w:canvas.width,h:canvas.height,square:false}];const w=Math.min(canvas.width/2,canvas.height*16/9),h=w*9/16,y=(canvas.height-h)/2,x=(canvas.width-2*w)/2;return[{x,y,w,h,square:false},{x:x+w,y,w,h,square:true}];}
function drawScreen(target,screen,squareOnly,entry=current,border=true,frozen=false){
 const {x,y,w,h}=screen,cx=x+w/2,cy=y+h/2,size=settings.size,m=entry?.match;
 target.save();target.beginPath();target.rect(x,y,w,h);target.clip();
 if(m){
  const media=frozen&&entry.poster?entry.poster:entry.kind==='video'&&(!entry.firstFrameReady||entry.media.seeking||entry.media.readyState<2)?entry.poster:entry.media;
  if(!media){target.restore();return;}
  if(squareOnly){const sw=media.videoWidth||media.naturalWidth||media.width,sh=media.videoHeight||media.naturalHeight||media.height;target.drawImage(media,(m.x-m.side/2)*sw/m.w,(m.y-m.side/2)*sh/m.h,m.side*sw/m.w,m.side*sh/m.h,cx-size/2,cy-size/2,size,size);}
  else target.drawImage(media,cx-m.x*m.zoom,cy-m.y*m.zoom,m.w*m.zoom,m.h*m.zoom);
 }else{target.fillStyle='#0000ff';target.fillRect(Math.round(cx-size/2),Math.round(cy-size/2),Math.round(size),Math.round(size));}
 if(border&&m&&(!settings.dual&&!(squareWindow&&!squareWindow.closed)||settings.showBorder)){target.lineWidth=1;target.strokeStyle='#fff';target.strokeRect(Math.round(cx-size/2)+.5,Math.round(cy-size/2)+.5,Math.round(size),Math.round(size));}target.restore();
}
function frame(now){

 if(current){
  const expired=current.kind==='video'?(now-shownAt>=settings.seconds*1000||current.media.ended):now-shownAt>=1000/settings.fps;

  if(!current.match){if(!lostAt)lostAt=now;if(now-lostAt>=0){if(mixed&&current.kind==='video'){current.media.pause();mixedNeedsImage=true;current=null;lastPaintKey='';advance();}else advance();}}else lostAt=0;
 }
 const paintKey=[!!(squareWindow&&!squareWindow.closed),shown,revision,settings.showBorder,settings.dual,canvas.width,canvas.height,current?.kind==='video'?(current.media.requestVideoFrameCallback?current.frameSerial:current.media.currentTime):current?.match?'match':'waiting',current?.match?.x,current?.match?.y,current?.match?.zoom].join(':');
 if(paintKey!==lastPaintKey&&(current?.match||shown===0)){
  ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);for(const screen of screens())drawScreen(ctx,screen,screen.square);
  if(squareWindow&&!squareWindow.closed){const c=squareWindow.document.querySelector('canvas');if(c){if(c.width!==squareWindow.innerWidth||c.height!==squareWindow.innerHeight){c.width=squareWindow.innerWidth;c.height=squareWindow.innerHeight;}const cctx=c.getContext('2d');cctx.fillStyle='#000';cctx.fillRect(0,0,c.width,c.height);drawScreen(cctx,{x:0,y:0,w:c.width,h:c.height},true);}}
  lastPaintKey=paintKey;
 }

}
addEventListener('keydown',event=>{

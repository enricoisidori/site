<text x="150" y="196">In the video</text>
<text x="330" y="196">Log moment  T^(k/5)</text>
<text x="1060" y="196">Shown on the hands</text>
<text x="1560" y="196">After the Big Bang</text>
<text x="1790" y="196">People</text>

<text x="30" y="50">Counting by hands, 2026</text>
<text x="30" y="78">Video 2, 6 cuts every 5 seconds (0:31): from the Big Bang to today on a logarithmic scale.</text>
<text x="30" y="106">Each cut multiplies the time by T^(1/5) ≈ 3,37 × 10³ s. Person 6 keeps counting through every cut; all the other hands change.</text>

$('legend-dialog').addEventListener('click',e=>{if(e.target===$('legend-dialog')){const r=$('legend-dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('legend-dialog').close()}});
$('stage').addEventListener('pointerdown',e=>{if(!networkState)return;const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let nearest=null,distance=14;networkState.points.forEach(point=>{const d=Math.hypot(point.x-x,point.y-y);if(d<distance){nearest=point;distance=d}});if(nearest){networkState.dragPoint=nearest;networkState.active=false;stage.setPointerCapture(e.pointerId);wakeNetwork();e.preventDefault()}});
$('stage').addEventListener('pointermove',e=>{if(!networkState)return;const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(networkState.dragPoint){networkState.dragPoint.x=Math.max(5,Math.min(w-5,x));networkState.dragPoint.y=Math.max(5,Math.min(h-5,y));networkState.dragPoint.vx=0;networkState.dragPoint.vy=0;wakeNetwork();return}networkState.mouseX=x;networkState.mouseY=y;networkState.active=true;wakeNetwork()});
const releaseNetwork=e=>{if(!networkState||!networkState.dragPoint)return;networkState.dragPoint=null;networkState.active=false;if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);wakeNetwork()};
$('stage').addEventListener('pointerup',releaseNetwork);$('stage').addEventListener('pointercancel',releaseNetwork);
$('stage').addEventListener('pointerleave',()=>{if(!networkState||networkState.dragPoint)return;networkState.active=false;wakeNetwork()});
let galleryFrame=0,gallerySnapshots=null;
function captureGallerySnapshots(){
 const snapshots=[];
 // Render each real chart once, then retain only its static vector geometry.
 document.body.classList.add('gallery-embed');
 capturing=true;
 for(const phase of [1,3,5,7,9,11]){
  screen=phase;render();
  const source=content.querySelector('svg');
  const bounds=stage.getBoundingClientRect();
  content.querySelectorAll('.row label,.row output,.axislabel').forEach(label=>{
   const rect=label.getBoundingClientRect(),style=getComputedStyle(label),text=document.createElementNS('http://www.w3.org/2000/svg','text');
   Object.entries({x:rect.left-bounds.left+rect.width/2,y:rect.top-bounds.top+rect.height/2,fill:'#f1f1ed','font-family':'Helvetica,Arial,sans-serif','font-size':parseFloat(style.fontSize),'text-anchor':'middle','dominant-baseline':'middle'}).forEach(([key,value])=>text.setAttribute(key,value));
   text.textContent=label.textContent;source.append(text);
  });
  const box=source.getBBox(),padding=18,copy=source.cloneNode(true);
  copy.removeAttribute('class');copy.removeAttribute('style');
  copy.setAttribute('xmlns','http://www.w3.org/2000/svg');
  copy.setAttribute('viewBox',`${box.x-padding} ${box.y-padding} ${box.width+padding*2} ${box.height+padding*2}`);
  copy.setAttribute('width',Math.ceil(box.width+padding*2));
  copy.setAttribute('height',Math.ceil(box.height+padding*2));
  snapshots.push(URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'})));
 }
 document.body.classList.remove('gallery-embed','slider-result','slider-screen','compass-screen');
 screen=12;capturing=false;
 return snapshots;
}
function buildConclusion(){
 if(!gallerySnapshots)gallerySnapshots=captureGallerySnapshots();
 syncScreenHash();
 document.body.classList.remove('entry');document.body.classList.add('conclusion');
 $('title').textContent='';$('hint').textContent='';$('legend').textContent='';$('next').disabled=false;$('next').textContent='Ricomincia';$('back').disabled=false;
 content.innerHTML='<div class="gallery-space" tabindex="0" aria-label="Sala delle visualizzazioni: scorri orizzontalmente per spostarti tra i pannelli, scorri verticalmente per zoomare"><div class="gallery-orbit"></div></div>';
 const space=content.firstElementChild,orbit=space.firstElementChild,panels=[];
 let selectedIndex=null,selectedType=null,focusTravel=0,travel=0,zoom=1,last=0,paused=false;
 const share=document.createElement('button');share.className='gallery-share';share.type='button';share.textContent='Condividi';content.append(share);
 share.onclick=async()=>{
  if(selectedType===null)return;
  const type=selectedType,title=questions[type].title;share.disabled=true;
  try{
   const blob=await fetch(gallerySnapshots[type]).then(response=>response.blob());
   const file=new File([blob],`cgil-visualizzazione-${type+1}.svg`,{type:'image/svg+xml'});
   if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title,files:[file]});}
   else{const link=document.createElement('a');link.href=gallerySnapshots[type];link.download=file.name;link.click();share.textContent='SVG scaricato';}
  }catch(error){if(error.name!=='AbortError')share.textContent='Riprova';}
  finally{share.disabled=false;}
 };
 [0,1,2,3,4,5].forEach((type,index)=>{
  const panel=document.createElement('button');panel.className='gallery-panel';panel.type='button';
  panel.setAttribute('aria-label',`Visualizzazione ${type+1}, pannello ${index+1}`);
  const open=()=>{selectedIndex=index;selectedType=type;focusTravel=-((index+.5)*Math.PI/3);travel=focusTravel;paused=true;share.textContent='Condividi';share.classList.add('visible')};
  panel.addEventListener('click',open);panel.addEventListener('pointerdown',open);panel.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();open()}};
  const card=document.createElement('div');card.className='gallery-card';
  card.onclick=event=>{event.stopPropagation();open()};
  const img=document.createElement('img');img.src=gallerySnapshots[type];img.alt=questions[type].title;
  card.append(img);panel.append(card);orbit.append(panel);panels.push(panel);
 });
 // An endless cylindrical gallery: six persistent panels advance along the
 // visible inner arc, wrapping behind the camera without duplicating the DOM.
 const update=time=>{
  const dt=last?Math.min(50,time-last):0;last=time;
  if(selectedIndex!==null){const delta=Math.atan2(Math.sin(focusTravel-travel),Math.cos(focusTravel-travel));travel+=delta*.14}else if(!paused&&!document.hidden)travel=(travel+dt*.000018)%(Math.PI*2);
  const fit=Math.min(1,stage.clientWidth/1850);
  const selectedScale=Math.min(stage.clientWidth*.88/(280*fit),stage.clientHeight*.84/(330*fit));
  orbit.style.transform=`translateZ(${-160+(zoom-1)*450}px) scale(${fit})`;
  panels.forEach((panel,index)=>{
   const theta=((((index+.5)*Math.PI/3+travel+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2))-Math.PI;
   const a=theta*.3,radius=1100;
   panel.style.opacity=selectedIndex===null?Math.min(1,(Math.PI-Math.abs(theta))/.12):index===selectedIndex?1:.32;
   panel.style.transform=`translate3d(${Math.sin(a)*radius}px,0,${radius*(1-Math.cos(a))}px) rotateY(${-a*180/Math.PI}deg) scale(${selectedIndex===index?selectedScale:1})`;
  });
  galleryFrame=requestAnimationFrame(update);
 };
 panels.forEach(panel=>{panel.onpointerenter=()=>paused=true;panel.onpointerleave=()=>paused=false;panel.onfocus=()=>paused=true;panel.onblur=()=>paused=false});
 space.onclick=event=>{if(event.target===space&&selectedIndex!==null){selectedIndex=null;selectedType=null;paused=false;share.classList.remove('visible')}};
 space.addEventListener('wheel',event=>{
  event.preventDefault();
  const horizontal=Math.abs(event.deltaX)>Math.abs(event.deltaY)||event.shiftKey;
  if(horizontal){
   selectedIndex=null;selectedType=null;paused=true;share.classList.remove('visible');
   travel+=((event.deltaX||event.deltaY)*.0024);
  }else zoom=Math.max(.4,Math.min(2,zoom-event.deltaY*.001));
 },{passive:false});
 space.onkeydown=event=>{if(event.key==='Escape'&&selectedIndex!==null){selectedIndex=null;selectedType=null;paused=false;share.classList.remove('visible')}if(event.key===' '){event.preventDefault();paused=!paused}if(event.key==='+')zoom=Math.min(2,zoom+.1);if(event.key==='-')zoom=Math.max(.4,zoom-.1)};
 ctx.clearRect(0,0,w,h);galleryFrame=requestAnimationFrame(update);
}
const galleryParams=new URLSearchParams(location.search);if(galleryParams.has('gallery')){document.body.classList.add('gallery-embed');screen=Math.max(1,Math.min(11,Number(galleryParams.get('phase'))||1));}
screenFromHash();
$('next').onclick=()=>{if(!$('next').disabled)navigate(screen===12?0:screen+1)};
$('back').onclick=()=>navigate(screen-1);
$('gallery-link').onclick=()=>navigate(12);
const restoreRoute=()=>{if(!screenFromHash())screen=0;render()};
window.addEventListener('popstate',restoreRoute);
window.addEventListener('hashchange',()=>{if(location.hash!==screenHash())restoreRoute()});
window.addEventListener('resize',()=>{if(screen!==12)size()});render();
</script>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cooperazione / Benessere — 3D</title>
  <style>
    @font-face { font-family: "Futura Condensed"; src: url("assets/font/Futura Bold Condensed.otf") format("opentype"); font-weight: 700; }
    @font-face { font-family: "Suisse Works"; src: url("assets/font/Suisse Works Book.otf") format("opentype"); font-weight: 400; }
    @font-face { font-family: "Suisse Works"; src: url("assets/font/Suisse Works Bold.otf") format("opentype"); font-weight: 700; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #fff;
      color: #151515;
      font-family: "Suisse Works", serif;
    }
    .progress-bar { position: fixed; z-index: 7; top: 0; left: 0; width: 100%; height: 4px; background: #e4e4e4; }
    .progress-bar span { display: block; height: 100%; background: #e52a20; transition: width .25s linear; }
    canvas { display: block; }
    .ui {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .question-panel { position:absolute; top:22px; left:0; right:0; width:min(800px,calc(100vw - 48px)); margin:0 auto; text-align:center; }
    .number { margin:0 0 10px; color:#e52a20; text-align:center; font:700 clamp(15px,1.5vw,21px)/1 "Suisse Works",serif; }
    .title {
      margin:0 auto;
      text-align: center;
      font: 700 clamp(33px,4.8vw,76px)/.95 "Futura Condensed", sans-serif;
      letter-spacing: .005em;
      text-transform: uppercase;
    }
    .instruction { margin:4px 0 0; color:#8a8a8a; text-align:center; font:400 clamp(17px,1.5vw,22px)/1.25 "Suisse Works",serif; transition:opacity .25s linear; }
    .ui.is-visual .number, .ui.is-visual .instruction { display:none; }
    .ui.is-visual .question-panel { top:26px; width:max-content; max-width:calc(100vw - 40px); }
    .ui.is-visual .title { width:max-content; max-width:calc(100vw - 40px); font-size:clamp(18px,2vw,30px); white-space:nowrap; }
    .hint {
      display:none;
      margin: 0;
      color: #6d6d6d;
      font: 400 13px/1.4 "Suisse Works", serif;
      line-height: 1.55;
      letter-spacing: 0;
      text-transform: none;
    }
    .others-caption {
      position: absolute;
      left: 50%;
      top: 64px;
      margin: 0;
      transform: translateX(-50%) translateY(8px);
      color: #8a8a8a;
      font:400 15px/1 "Suisse Works",serif;
      opacity: 0;
      transition: opacity .8s ease, transform .8s ease;
      white-space: nowrap;
    }
    .others-caption.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .nav-button {
      position: absolute; bottom:28px; min-width:0; min-height:0; display:grid; place-items:center;
      pointer-events: auto;
      border: 0; background: transparent; color: #171717; text-decoration: none;
      font: 700 19px/1 "Suisse Works",serif; transition: transform .08s linear;
    }
    .nav-button:hover { transform: translateY(-5px); }
    .nav-button.previous { left:32px; padding:9px 0; }
    .nav-button.next { right:32px; min-width:132px; padding:14px 18px 13px; border:1px solid #e52a20; background:#e52a20; color:#fff; }
    @media (max-width: 680px) {
      .question-panel { top:20px; width:calc(100vw - 40px); }
      .title { font-size:clamp(32px,10vw,50px); }
      .instruction { font-size:17px; }
      .ui.is-visual .question-panel { top:20px; max-width:calc(100vw - 32px); }
      .ui.is-visual .title { max-width:calc(100vw - 32px); font-size:18px; }
      .others-caption { top:48px; font-size:13px; }
      .nav-button { bottom: 18px; }
      .nav-button.previous { left: 20px; }
      .nav-button.next { right: 20px; }
    }
    .error {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      place-items: center;
      padding: 30px;
      background: #fff;
      text-align: center;
      line-height: 1.5;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="progress-bar" id="progress-bar" aria-label="Avanzamento"><span id="progress"></span></div>
  <div class="ui">
    <div class="question-panel"><p class="number" id="question-number"></p><h1 class="title" id="question-title"></h1><p class="instruction" id="instruction"></p></div>
    <a class="nav-button previous" id="previous-question" href="#" aria-label="Domanda precedente">Indietro</a>
    <a class="nav-button next" id="next-question" href="#" aria-label="Domanda successiva">Prosegui</a>
    <p class="hint" id="hint">Muovi il mouse sul piano<br>per scegliere la tua posizione</p>
    <p class="others-caption" id="others-caption">Risposte degli altri utenti</p>
  </div>
  <div class="error" id="error">
    Impossibile caricare la scena 3D.<br>
    Apri la pagina con una connessione internet attiva.
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

    const compassConfigs = {
      3: {
        title: '3. Come ritieni l’impatto delle nuove tecnologie e dell’Intelligenza Artificiale nel tuo lavoro?',
        axes: ['Facilita il mio lavoro', 'Non facilita il mio lavoro', 'Alleggerisce il carico di lavoro', 'Aumenta il carico di lavoro']
      },
      4: {
        title: '4. Quale equilibrio dovrebbe cercare il lavoro contemporaneo?',
        axes: ['Competizione', 'Cooperazione', 'Produttività', 'Benessere']
      },
      5: {
        title: '5. Quali rischi peseranno maggiormente nel lavoro del futuro?',
        axes: ['Perdita di posti a causa dell’automazione', 'Aumento della precarietà', 'Controllo digitale dei lavoratori', 'Disuguaglianze economiche']
      }
    };
    const questionNumber = Number(new URLSearchParams(location.search).get('q')) || 5;
    const compassConfig = compassConfigs[questionNumber] || compassConfigs[5];
    const questionHref = number => {
      if (number === 1) return 'cgil.html';
      if (number === 6) return 'cgil.html?q=6';
      if (number === 2) return 'cgil-02.html';
      return `cgil-03-05.html?q=${number}`;
    };
    document.title = `${compassConfig.title} — Compass`;
    document.querySelector('#question-number').textContent = `${questionNumber} di 6`;
    document.querySelector('#question-title').textContent = compassConfig.title.replace(/^\d+\.\s*/, '');
    document.querySelector('#instruction').textContent = questionNumber === 5 ? 'Regola gli slider' : 'Posizionati rispetto agli assi';
    document.querySelector('#previous-question').href = questionHref(questionNumber - 1);
    document.querySelector('#next-question').href = questionHref(questionNumber + 1);
    const progress = document.querySelector('#progress');
    const progressBar = document.querySelector('#progress-bar');
    const questionStep = questionNumber * 2 - 1;
    progress.style.width = `${questionStep / 12 * 100}%`;
    progressBar.setAttribute('aria-label', `Avanzamento: passaggio ${questionStep} di 12`);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    scene.fog = new THREE.Fog(0xffffff, 52, 95);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    const topCameraPosition = new THREE.Vector3(0, 29, 0.01);
    const axonometricCameraPosition = new THREE.Vector3(15, 13, 17);
    const topTarget = new THREE.Vector3(0, 0, 0);
    const axonometricTarget = new THREE.Vector3(1.3, 1.8, 1.4);
    camera.position.copy(topCameraPosition);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(topTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 10;
    controls.maxDistance = 34;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minPolarAngle = 0.001;
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.update();

    scene.add(new THREE.HemisphereLight(0xffffff, 0xcacaca, 2.25));
    const sun = new THREE.DirectionalLight(0xffffff, 4.4);
    sun.position.set(-7, 18, -4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -13;
    sun.shadow.camera.right = 13;
    sun.shadow.camera.top = 13;
    sun.shadow.camera.bottom = -13;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 38;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    // Pavimento bianco continuo: gli assi definiscono lo spazio, le ombre
    // mantengono il legame con la visualizzazione successiva.
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(2000,2000),
      new THREE.ShadowMaterial({color:0x000000,opacity:.13,transparent:true})
    );
    floor.rotation.x=-Math.PI/2;
    floor.position.y=-.12;
    floor.receiveShadow=true;
    scene.add(floor);

    // Quattro assi reali sul piano: frecce dal centro e parole alle estremità.
    const axes = new THREE.Group();
    const axisOrigin = new THREE.Vector3(0, 0.13, 0);
    function addAxis(direction) {
      const arrowLength = 7.28;
      const arrow = new THREE.ArrowHelper(direction, axisOrigin, arrowLength, 0x111111, 0.30, 0.20);
      arrow.line.material.depthTest = true;
      arrow.cone.material.depthTest = true;
      arrow.line.visible = false;
      const rod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.011, 0.011, arrowLength - 0.28, 8),
        new THREE.MeshBasicMaterial({ color: 0x111111, depthTest: true })
      );
      rod.position.copy(axisOrigin).addScaledVector(direction, (arrowLength - 0.34) / 2);
      rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
      axes.add(rod);
      axes.add(arrow);
    }
    addAxis(new THREE.Vector3(1, 0, 0));
    addAxis(new THREE.Vector3(-1, 0, 0));
    addAxis(new THREE.Vector3(0, 0, 1));
    addAxis(new THREE.Vector3(0, 0, -1));

    function makeAxisLabel(text) {
      const isLong = text.length > 22;
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = isLong ? 260 : 180;
      const context = canvas.getContext('2d');
      context.fillStyle = '#111111';
      let lines = [text];
      if (isLong) {
        const words = text.split(' ');
        let first = '';
        let second = '';
        words.forEach(word => {
          if ((first + ' ' + word).trim().length <= Math.ceil(text.length / 2) || !first) first = `${first} ${word}`.trim();
          else second = `${second} ${word}`.trim();
        });
        lines = [first, second].filter(Boolean);
      }
      let fontSize = isLong ? 54 : 62;
      do {
        context.font = `700 ${fontSize}px "Suisse Works", serif`;
        fontSize -= 2;
      } while (Math.max(...lines.map(line => context.measureText(line).width)) > 900 && fontSize > 34);
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      const lineHeight = isLong ? 61 : 68;
      lines.forEach((line, index) => {
        const y = canvas.height / 2 + (index - (lines.length - 1) / 2) * lineHeight;
        context.fillText(line, 512, y);
      });
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      const label = new THREE.Sprite(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false
      }));
      label.scale.set(isLong ? 4.9 : 4.05, isLong ? 1.2 : 0.71, 1);
      label.renderOrder = 9;
      return label;
    }
    [
      [compassConfig.axes[0], -8.25, 0],
      [compassConfig.axes[1], 8.25, 0],
      [compassConfig.axes[2], 0, -8.25],
      [compassConfig.axes[3], 0, 8.25]
    ].forEach(([text, x, z]) => {
      const label = makeAxisLabel(text);
      label.position.set(x, 0.24, z);
      axes.add(label);
    });
    scene.add(axes);

    const world = new CANNON.World({
      gravity: new CANNON.Vec3(0, -13.5, 0)
    });
    world.allowSleep = true;
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.solver.iterations = 16;

    const cubeMaterial = new CANNON.Material('cube');
    const groundMaterial = new CANNON.Material('ground');
    world.addContactMaterial(new CANNON.ContactMaterial(cubeMaterial, groundMaterial, {
      friction: 0.62,
      restitution: 0.08,
      contactEquationStiffness: 1e8,
      contactEquationRelaxation: 3
    }));
    world.addContactMaterial(new CANNON.ContactMaterial(cubeMaterial, cubeMaterial, {
      friction: 0.52,
      restitution: 0.06
    }));

    const groundBody = new CANNON.Body({
      mass: 0,
      material: groundMaterial,
      shape: new CANNON.Box(new CANNON.Vec3(7, 0.1, 7)),
      position: new CANNON.Vec3(0, -0.12, 0)
    });
    world.addBody(groundBody);

    // Un bordo fisico basso e invisibile mantiene l'accumulo nel quadrante
    // senza trasformarlo in una griglia rigida: in cima i cubi possono traboccare.
    function addBarrier(x, z, halfX, halfZ) {
      const barrier = new CANNON.Body({
        mass: 0,
        material: groundMaterial,
        shape: new CANNON.Box(new CANNON.Vec3(halfX, 0.72, halfZ)),
        position: new CANNON.Vec3(x, 0.62, z)
      });
      world.addBody(barrier);
    }
    addBarrier(0.05, 3.5, 0.04, 3.45);
    addBarrier(6.95, 3.5, 0.04, 3.45);
    addBarrier(3.5, 0.05, 3.45, 0.04);
    addBarrier(3.5, 6.95, 3.45, 0.04);

    const redMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xf02b20, roughness: 0.42, metalness: 0.02 }),
      new THREE.MeshStandardMaterial({ color: 0xd9231a, roughness: 0.5, metalness: 0 }),
      new THREE.MeshStandardMaterial({ color: 0xff3b2d, roughness: 0.38, metalness: 0.03 })
    ];
    const cubes = [];
    const maxCubes = 120;
    let spawnClock = 0;
    let spawnIndex = 0;
    let hasPlaced = false;
    let revealOthers = false;
    let myCube = null;
    let myCubeBody = null;
    let myCubeFade = 0;
    let cameraTransition = 0;
    let otherWait = -1;
    const hint = document.querySelector('#hint');
    const othersCaption = document.querySelector('#others-caption');
    function spawnCube(delayHeight = 0) {
      if (cubes.length >= maxCubes) return;
      const size = THREE.MathUtils.randFloat(0.46, 0.67);
      const geometry = new THREE.BoxGeometry(size, size, size);
      const mesh = new THREE.Mesh(geometry, redMaterials[spawnIndex % redMaterials.length]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      // Posizione nel quadrante +x / +z: Cooperazione e Benessere.
      const angle = spawnIndex * 2.39996;
      const radius = Math.min(1.8, 0.3 + spawnIndex * 0.018);
      const x = 3.25 + Math.cos(angle) * radius + THREE.MathUtils.randFloatSpread(0.45);
      const z = 3.2 + Math.sin(angle) * radius + THREE.MathUtils.randFloatSpread(0.45);
      const y = 8.2 + delayHeight + Math.random() * 3;
      mesh.position.set(x, y, z);
      mesh.rotation.set(Math.random(), Math.random(), Math.random());
      scene.add(mesh);

      const half = size / 2;
      const body = new CANNON.Body({
        mass: size * 1.35,
        material: cubeMaterial,
        shape: new CANNON.Box(new CANNON.Vec3(half, half, half)),
        position: new CANNON.Vec3(x, y, z),
        angularDamping: 0.18,
        linearDamping: 0.015,
        sleepSpeedLimit: 0.12,
        sleepTimeLimit: 1.2
      });
      body.quaternion.setFromEuler(mesh.rotation.x, mesh.rotation.y, mesh.rotation.z);
      body.angularVelocity.set(
        THREE.MathUtils.randFloatSpread(1.8),
        THREE.MathUtils.randFloatSpread(1.8),
        THREE.MathUtils.randFloatSpread(1.8)
      );
      world.addBody(body);
      cubes.push({ mesh, body });
      spawnIndex++;
    }

    function clearCubes() {
      cubes.forEach(({ mesh, body }) => {
        scene.remove(mesh);
        mesh.geometry.dispose();
        world.removeBody(body);
      });
      cubes.length = 0;
      spawnIndex = 0;
      spawnClock = 0;
    }

    // Nella vista zenitale l'hover è volutamente un solo quadrato piatto.
    const previewMaterial = new THREE.MeshBasicMaterial({
      color: 0xf02b20,
      transparent: true,
      opacity: 0.24,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const preview = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), previewMaterial);
    preview.rotation.x = -Math.PI / 2;
    preview.position.y = 0.04;
    preview.visible = false;
    scene.add(preview);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hoverPoint = new THREE.Vector3();
    let pointerDown = null;

    function updatePreview(event) {
      if (hasPlaced) return;
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      if (raycaster.ray.intersectPlane(plane, hoverPoint) &&
          Math.abs(hoverPoint.x) < 6.75 && Math.abs(hoverPoint.z) < 6.75) {
        preview.position.set(hoverPoint.x, 0.04, hoverPoint.z);
        preview.visible = true;
        renderer.domElement.style.cursor = 'crosshair';
      } else {
        preview.visible = false;
        renderer.domElement.style.cursor = 'grab';
      }
    }

    function placeMyCube() {
      if (hasPlaced || !preview.visible) return;
      hasPlaced = true;
      document.querySelector('.ui').classList.add('is-visual');
      progress.style.width = `${questionNumber * 2 / 12 * 100}%`;
      progressBar.setAttribute('aria-label', `Avanzamento: passaggio ${questionNumber * 2} di 12`);
      preview.visible = false;
      renderer.domElement.style.cursor = 'grab';
      const material = new THREE.MeshStandardMaterial({
        color: 0xe9241a,
        transparent: true,
        opacity: 0,
        roughness: 0.34,
        metalness: 0.03
      });
      myCube = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.72, 0.72), material);
      myCube.position.set(hoverPoint.x, 11.5, hoverPoint.z);
      myCube.rotation.set(0.08, 0.24, -0.05);
      myCube.castShadow = true;
      myCube.receiveShadow = true;
      scene.add(myCube);
      myCubeBody = new CANNON.Body({
        mass: 1.1,
        material: cubeMaterial,
        shape: new CANNON.Box(new CANNON.Vec3(0.36, 0.36, 0.36)),
        position: new CANNON.Vec3(hoverPoint.x, 11.5, hoverPoint.z),
        angularDamping: 0.2,
        sleepSpeedLimit: 0.12,
        sleepTimeLimit: 0.8
      });
      myCubeBody.quaternion.setFromEuler(myCube.rotation.x, myCube.rotation.y, myCube.rotation.z);
      myCubeBody.angularVelocity.set(0.45, -0.25, 0.34);
      world.addBody(myCubeBody);
      hint.innerHTML = 'Il tuo cubo sta cadendo.<br>Poi vedrai dove si è formato il gruppo';
      myCubeFade = 0.01;
      cameraTransition = 0.001;
    }

    function resetExperience() {
      clearCubes();
      if (myCube) {
        scene.remove(myCube);
        myCube.geometry.dispose();
        myCube.material.dispose();
        myCube = null;
      }
      if (myCubeBody) {
        world.removeBody(myCubeBody);
        myCubeBody = null;
      }
      hasPlaced = false;
      document.querySelector('.ui').classList.remove('is-visual');
      progress.style.width = `${questionStep / 12 * 100}%`;
      progressBar.setAttribute('aria-label', `Avanzamento: passaggio ${questionStep} di 12`);
      revealOthers = false;
      myCubeFade = 0;
      otherWait = -1;
      cameraTransition = 0;
      camera.position.copy(topCameraPosition);
      controls.target.copy(topTarget);
      controls.enableRotate = false;
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.update();
      preview.visible = false;
      othersCaption.classList.remove('visible');
      hint.innerHTML = 'Muovi il mouse sul piano<br>per scegliere la tua posizione';
    }

    renderer.domElement.addEventListener('pointermove', updatePreview);
    renderer.domElement.addEventListener('pointerdown', event => {
      pointerDown = { x: event.clientX, y: event.clientY };
    });
    renderer.domElement.addEventListener('pointerup', event => {
      if (!pointerDown) return;
      const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
      pointerDown = null;
      if (moved < 6) placeMyCube();
    });
    resetExperience();

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      if (cameraTransition > 0 && cameraTransition < 1) {
        cameraTransition = Math.min(1, cameraTransition + delta * 0.88);
        const ease = 1 - Math.pow(1 - cameraTransition, 3);
        camera.position.lerpVectors(topCameraPosition, axonometricCameraPosition, ease);
        controls.target.lerpVectors(topTarget, axonometricTarget, ease);
        if (cameraTransition === 1) {
          controls.enableRotate = true;
          controls.enableZoom = true;
          controls.enablePan = true;
        }
      }
      if (myCube && myCubeFade < 1) {
        myCubeFade = Math.min(1, myCubeFade + delta * 1.3);
        myCube.material.opacity = myCubeFade;
      }
      if (myCube && myCubeBody) {
        myCube.position.copy(myCubeBody.position);
        myCube.quaternion.copy(myCubeBody.quaternion);
        const hasLanded = myCubeBody.position.y < 1.1 && Math.abs(myCubeBody.velocity.y) < 0.8;
        if (hasLanded && otherWait < 0 && !revealOthers) {
          otherWait = 0.85;
          hint.innerHTML = '';
        }
        if (otherWait > 0 && !revealOthers) {
          otherWait -= delta;
        }
        if (otherWait <= 0 && otherWait > -1 && !revealOthers) {
          revealOthers = true;
          othersCaption.classList.add('visible');
          for (let i = 0; i < 4; i++) spawnCube(i * 0.45);
        }
      }
      if (revealOthers) {
        spawnClock += delta;
        if (spawnClock > 0.34 && cubes.length < maxCubes) {
          spawnClock = 0;
          spawnCube();
        }
      }

      world.step(1 / 60, delta, 4);
      cubes.forEach(({ mesh, body }) => {
        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
        // Recupera rarissimi cubi che riescono a cadere oltre il piano.
        if (body.position.y < -8) {
          body.position.set(3.2, 13, 3.2);
          body.velocity.setZero();
          body.angularVelocity.setZero();
        }
      });
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
  <script>
    addEventListener('error', () => {
      document.querySelector('#error').style.display = 'grid';
    });
  </script>
</body>
</html>

<html lang="it">

  <style>

    .selection {
      position: fixed; inset: 0; z-index: 3; overflow: auto; padding: 22px 24px 104px;
      background: #fff; transition: opacity .65s ease, transform .75s cubic-bezier(.22,.8,.2,1);
    }
    body.is-revealed .selection { opacity: 0; transform: none; pointer-events: none; transition: none; }
    body.stage-active .selection { background: transparent; }
    .panel { width: min(800px,100%); margin: -4px auto 0; text-align: center; }

    .instruction { margin: 4px 0 20px; color: #8a8a8a; font: 400 clamp(17px,1.5vw,22px)/1.25 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0; }

    .back, .next { border: 0; cursor: pointer; font: 700 19px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .03em; transition: transform .08s linear; }
    .back { padding: 9px 0; background: transparent; color: #111; }

    .visual-question { position: fixed; z-index: 4; top: 26px; left: 50%; width: max-content; max-width: calc(100vw - 40px); margin: 0; color: var(--ink); font: 700 clamp(15px,1.8vw,26px)/1 "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: center; text-transform: uppercase; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateX(-50%); transition: opacity .3s linear; }
    .visual-caption { position: fixed; z-index: 4; top: 58px; left: 50%; margin: 0; color: #8a8a8a; font: 400 15px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateX(-50%); transition: opacity .3s linear; }

    @media (max-width: 680px) { .selection { padding: 20px 20px 92px; } h1 { font-size: clamp(32px,10vw,50px); } .instruction { margin-bottom: 26px; } .option { font-size: 21px; padding: 9px 0; } .nav { left: 20px; right: 20px; bottom: 18px; } dialog { inset: 50% 20px auto; width: calc(100vw - 40px); } .visual-question { top: 20px; max-width: calc(100vw - 32px); font-size: 18px; } }

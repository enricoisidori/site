<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>image</title><link rel="icon" href="data:,"><style>
html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:white}
main{position:fixed;inset:0}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
</style></head><body><main aria-label="immagini internet archive"></main><script>
(() => {
"use strict";
// Normal requests keep the original fetch path. Search can recover through
// Archive JSONP, then the independent scrape endpoint, without a private proxy.
let sequence = 0;
function jsonp(url, signal) {
  const target = new URL(url);
  if (target.origin !== 'https://archive.org' || target.pathname !== '/advancedsearch.php') throw new Error('invalid JSONP endpoint');
  return new Promise((resolve, reject) => {
    const name = '__archive' + Date.now() + '_' + (++sequence);
    const script = document.createElement('script');
    let timer, settled = false;
    const finish = (error, data) => {
      if (settled) return; settled = true;
      clearTimeout(timer); signal?.removeEventListener('abort', abort); script.remove();
      window[name] = () => {}; setTimeout(() => { delete window[name]; }, 60000);
      error ? reject(error) : resolve(data);
    };
    const abort = () => finish(signal.reason || new DOMException('aborted', 'AbortError'));
    if (signal?.aborted) return abort();
    window[name] = data => data.error ? finish(new Error(String(data.error))) : finish(null, data);
    script.onerror = () => finish(new Error('ricerca Archive non disponibile'));
    target.searchParams.set('callback', name); script.src = target.href;
    signal?.addEventListener('abort', abort, { once: true });
    timer = setTimeout(() => finish(new Error('timeout ricerca Archive')), 8000);
    document.head.append(script);
  });
}
async function direct(url, signal) {
  const response = await fetch(url, { signal: AbortSignal.any([signal || new AbortController().signal, AbortSignal.timeout(10000)]) });
  if (!response.ok) throw new Error('Archive HTTP ' + response.status);
  const data = await response.json();
  if (data.error) throw new Error(String(data.error));
  return data;
}
async function archiveJSON(url, signal) {
  const search = url.includes('/advancedsearch.php');
  let error;
  // file:// sends Origin:null; avoid the known failing fetch before JSONP.
  if (!search || location.protocol !== 'file:') {
    try { return await direct(url, signal); }
    catch (failure) { if (signal?.aborted) throw failure; error = failure; }
  }
  if (!search) throw error;
  try { return await jsonp(url, signal); }
  catch (failure) { if (signal?.aborted) throw failure; error = failure; }
  const original = new URL(url);
  const params = new URLSearchParams({ q: original.searchParams.get('q'), fields: 'identifier,title', count: '100' });
  const sort = original.searchParams.get('sort[]'); if (sort) params.set('sorts', sort);
  if (original.searchParams.get('rows') === '1') params.set('total_only', 'true');
  try {
    const data = await direct('https://archive.org/services/search/v1/scrape?' + params, signal);
    if (data.total == null) throw new Error('risposta Archive incompleta');
    // Recovery still applies the full query; randomness is limited to this batch.
    return { response: { numFound: Number(data.total), docs: data.items || [] }, recovery: true };
  } catch (failure) {
    if (signal?.aborted) throw failure;
    throw new Error('ricerca Archive non disponibile: ' + (failure.message || error.message));
  }
}

// Embedded by build-image.mjs: image.html needs no server or module imports.
const stage = document.querySelector('main');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const queue = [], ids = [], seen = new Set(), totals = new Map();
const alphabet = 'abcdefghijklmnopqrstuvwxyz0123456789';
const sorts = ['identifier asc', 'identifier desc', 'addeddate asc', 'addeddate desc'];
let current, inFlight = 0, searching = false, nextSearch = 0, last = -Infinity, timer;
const pick = values => values[Math.floor(Math.random() * values.length)];
function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  return items;
}
function remember(items) {
  for (const item of shuffle([...items])) {
    const id = typeof item === 'string' ? item : item.identifier;
    if (!id || seen.has(id)) continue;
    seen.add(id); ids.push(id);
  }
  try { localStorage.setItem('image:seeds:v1', JSON.stringify(ids.slice(-150))); } catch {}
}
async function refill() {
  if (searching || Date.now() < nextSearch || document.hidden) return;
  searching = true;
  const prefix = pick(alphabet), total = totals.get(prefix);
  const page = total ? 1 + Math.floor(Math.random() * Math.ceil(Math.min(total, 10000) / 100)) : 1;
  const params = new URLSearchParams({q:'mediatype:image AND NOT access-restricted-item:true AND identifier:' + prefix + '*', rows:'100', page:String(page), output:'json', 'fl[]':'identifier', 'sort[]':pick(sorts)});
  try {
    const data = await archiveJSON('https://archive.org/advancedsearch.php?' + params, AbortSignal.timeout(12000));
    totals.set(prefix, Number(data.response?.numFound) || 0);
    remember(data.response?.docs || []);
    nextSearch = Date.now() + 250;
  } catch { nextSearch = Date.now() + 1500; }
  finally { searching = false; pump(); }
}
function pump() {
  if (document.hidden) return;
  while (inFlight < 4 && queue.length + inFlight < 10 && ids.length) {
    const image = new Image(), id = ids.shift();
    image.decoding = 'async'; image.fetchPriority = current ? 'low' : 'high';
    inFlight++;
    let settled = false;
    const finish = success => {
      if (settled) return; settled = true; clearTimeout(timeout);
      image.onload = image.onerror = null; inFlight--;
      if (success && image.naturalWidth) { queue.push(image); show(); }
      pump();
    };
    const timeout = setTimeout(() => finish(false), 6000);
    image.onload = () => image.decode().then(() => finish(true), () => finish(false));
    image.onerror = () => finish(false);
    image.src = 'https://archive.org/services/img/' + encodeURIComponent(id);
  }
  if (ids.length < 25) refill();
}
function show() {
  if (document.hidden || !queue.length || performance.now() - last < (reduced ? 1500 : 120)) return;
  const image = queue.shift(); image.alt = ''; image.draggable = false;
  if (current) current.replaceWith(image); else stage.append(image);
  current = image; last = performance.now();
}
function cycle() {
  clearTimeout(timer);
  if (document.hidden) return;
  show(); pump(); timer = setTimeout(cycle, reduced ? 1500 : 60);
}
document.addEventListener('visibilitychange', cycle);
try { remember(JSON.parse(localStorage.getItem('image:seeds:v1') || '[]')); } catch {}
cycle();

})();
</script></body></html>

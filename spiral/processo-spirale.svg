<title id="title">Spiral — flusso logico del montaggio infinito</title><desc id="desc">Undici passaggi lungo una spirale. Il video A continua in loop mentre il video B viene riconosciuto, cercato, scaricato e verificato. Si cambia soltanto quando B ha un fotogramma decodificato.</desc>

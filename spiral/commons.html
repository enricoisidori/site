<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Spiral / Commons</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-mode="commons">
  <main aria-label="Sequenza associativa di immagini Commons">
  </main>
  <p id="status" role="status">Ricerca di una prima immagine…</p>
  <div id="words" hidden aria-label="Parole riconosciute nel fotogramma"></div>
  <aside id="info" hidden aria-label="Informazioni sull’immagine e riconoscimento immagini">
    <header><strong>SPIRAL / Commons</strong><span>I per nascondere</span></header>
    <section class="info-selection">
      <h2>Come è stata scelta l’immagine attuale</h2>
      <p id="info-chain"></p>
      <p id="info-reason"></p>
      <p id="info-match"></p>
      <details><summary>Tentativi che hanno portato a questa immagine</summary><ul id="info-selection-attempts"></ul></details>
    </section>
    <dl id="info-fields"></dl>
    <figure id="info-frame" hidden>
      <img id="info-image" alt="Immagine usata dal modello per riconoscere gli oggetti">
      <figcaption id="info-caption"></figcaption>
    </figure>
    <h2>Oggetti riconosciuti / confidenza</h2>
    <ul id="info-predictions"></ul>
    <h2>Ricerca della prossima immagine / in corso</h2>
    <ul id="info-search-attempts"></ul>
    <p id="info-error" hidden></p>
  </aside>
  <script src="./bootstrap.js"></script>
</body>
</html>

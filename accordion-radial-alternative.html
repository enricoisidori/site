<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CGIL — Accordion radiale</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#141414;color:#f1f1ed;font-family:Helvetica,Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:30px}svg{display:block;width:min(1100px,96vw);height:auto;overflow:visible}.label{font-size:11px;fill:#f1f1ed}.percent{font-size:12px;fill:#f1f1ed}.measure{font-size:8px;fill:#aaa}
</style>
</head>
<body>
<main><svg id="accordion" viewBox="0 0 1200 800" role="img" aria-label="Diagramma accordion radiale delle conquiste sindacali"></svg></main>
<script>
'use strict';
const svg=document.getElementById('accordion'),ns='http://www.w3.org/2000/svg';
const labels=['Riduzione dell’orario di lavoro','Statuto dei lavoratori','Ferie retribuite','Diritto di sciopero','Tutele sulla salute e sicurezza','Diritto alla formazione','Pensioni e tutele previdenziali','Contrattazione collettiva'];
const weights=[78,2,18,8,52,1,4,17],relations=[[0,3,68],[0,4,57],[0,7,28],[1,2,4],[1,3,3],[1,6,1],[2,4,21],[2,6,5],[3,4,14],[3,7,6],[4,5,3],[5,6,1],[6,7,7],[0,2,13],[1,5,1]];
const cx=600,cy=400,outer=225,unit=Math.PI*2/8,gap=.055,total=weights.reduce((a,b)=>a+b,0);
const make=(name,attrs,parent=svg)=>{const el=document.createElementNS(ns,name);Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));parent.append(el);return el};
const point=(radius,angle)=>({x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius});
const arc=(radius,start,end,reverse=false)=>{const a=point(radius,start),b=point(radius,end);return `A ${radius} ${radius} 0 0 ${reverse?0:1} ${b.x} ${b.y}`};
const base=make('g',{id:'construction',fill:'none',stroke:'#f1f1ed',opacity:.3});[42,84,126,168,outer+21].forEach((radius,i)=>make('circle',{cx,cy,r:radius,'stroke-width':i===4?.7:.5,'stroke-dasharray':i===4?'2 4':'2 7'},base));
const sectors=weights.map((weight,index)=>{const start=-Math.PI/2+unit*index+gap,end=-Math.PI/2+unit*(index+1)-gap,angle=(start+end)/2,band=8+weight/78*45,inset=(1-weight/78)*48,outerEdge=outer-inset,inside=outerEdge-band;return {weight,index,start,end,angle,band,inset,outerEdge,inside}});
const anchors=sectors.map(sector=>point(sector.inside,sector.angle));
const connectionLayer=make('g',{id:'connections',fill:'none',stroke:'#f1f1ed'});
relations.forEach(([from,to,weight],index)=>{const a=anchors[from],b=anchors[to],distance=Math.hypot(a.x-b.x,a.y-b.y)||1,bend=(index%2?1:-1)*(18+(index%4)*9),mx=cx+(a.x+b.x-2*cx)*.07,my=cy+(a.y+b.y-2*cy)*.07,qx=mx-bend*(a.y-b.y)/distance,qy=my+bend*(a.x-b.x)/distance;make('path',{id:`link-${index}`,d:`M ${a.x} ${a.y} Q ${qx} ${qy} ${b.x} ${b.y}`,'stroke-width':(.25+weight*.048).toFixed(2),opacity:Math.min(.86,.12+weight*.016).toFixed(2)},connectionLayer)});
const sectorLayer=make('g',{id:'sectors',stroke:'#f1f1ed'});
sectors.forEach(sector=>{const group=make('g',{id:`sector-${sector.index}`},sectorLayer),radius=sector.outerEdge-sector.band/2;make('path',{d:`M ${point(radius,sector.start).x} ${point(radius,sector.start).y} ${arc(radius,sector.start,sector.end)}`,fill:'none','stroke-width':sector.band},group);make('path',{d:`M ${point(sector.outerEdge-18,sector.start).x} ${point(sector.outerEdge-18,sector.start).y} ${arc(sector.outerEdge-18,sector.start,sector.end)}`,fill:'none','stroke-width':.75,opacity:.72},group);const divisions=6;for(let tick=0;tick<=divisions;tick++){const angle=sector.start+(sector.end-sector.start)*tick/divisions,major=tick===0||tick===divisions||tick%2===0,p1=point(major?sector.outerEdge-sector.band-5:sector.outerEdge-sector.band/2,angle),p2=point(sector.outerEdge+6,angle);make('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,'stroke-width':major?1:.55},group)}});
const labelsLayer=make('g',{id:'labels'});
sectors.forEach(sector=>{const outward=point(sector.outerEdge+8,sector.angle),percent=point(sector.outerEdge+28,sector.angle),labelPoint=point(sector.outerEdge+65,sector.angle),anchor=anchors[sector.index],cos=Math.cos(sector.angle),textAnchor=cos>.28?'start':cos<-.28?'end':'middle';make('line',{x1:anchor.x,y1:anchor.y,x2:outward.x,y2:outward.y,stroke:'#f1f1ed','stroke-width':.7,opacity:.7},labelsLayer);const percentage=make('text',{x:percent.x,y:percent.y,'text-anchor':'middle','dominant-baseline':'middle',class:'percent'},labelsLayer);percentage.textContent=`${Math.round(sector.weight/total*100)}%`;const label=make('text',{x:labelPoint.x,y:labelPoint.y,'text-anchor':textAnchor,'dominant-baseline':'middle',class:'label'},labelsLayer);label.textContent=labels[sector.index]});
</script>
</body>
</html>

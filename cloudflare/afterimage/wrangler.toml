# Afterimage for iPhone/iPad: page and Archive video relay on one origin.
# Build:  node tools/build-afterimage-cloudflare.mjs
# Deploy: cd cloudflare/afterimage && npx wrangler deploy
name = "afterimage"
main = "../../tools/blueness-media-worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/__blueness_media/*"]

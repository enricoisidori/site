# Blueness on Cloudflare (Worker + static assets): the page and the video relay
# share one origin, which iPhone Safari requires to read video pixels.
# The rest of enricoisidori.com stays on GitHub Pages.
# Build:  node tools/build-blueness-pages.mjs
# Local:  cd cloudflare/blueness-pages && npx wrangler dev
# Deploy: cd cloudflare/blueness-pages && npx wrangler deploy
name = "blueness"
main = "../../tools/blueness-media-worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Only the relay runs code; every other path is a static file.
run_worker_first = ["/__blueness_media/*"]

<!doctype html>
<html lang="it">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>observation</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      font: 12px/1.5 monospace;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #loading {
      background: #000;
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: #888;
    }
    #loading[hidden],
    #words[hidden],
    #info[hidden] {
      display: none;
    }
    #words {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
      font: clamp(22px, 4vw, 64px)/1.2 sans-serif;
      padding: 8vw;
    }
    #info {
      position: fixed;
      left: 16px;
      top: 16px;
      max-width: min(680px, calc(100vw - 32px));
      max-height: 90vh;
      overflow: auto;
      background: #000d;
      padding: 16px;
      white-space: pre-wrap;
    }
    mark {
      background: #fff;
      color: #000;
    }
    a {
      color: inherit;
    }
  </style>
  <video muted playsinline></video>
  <div id="loading">·</div>
  <div id="words" hidden></div>
  <div id="info" hidden></div>
  <!-- OBSERVATION_SCRIPTS -->
</html>

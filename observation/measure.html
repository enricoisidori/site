<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Observation · confronto rete</title>
    <style>
      body {
        background: #111;
        color: #ddd;
        font: 13px monospace;
        white-space: pre-wrap;
      }
      video {
        width: 320px;
      }
      a {
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Streaming / download · misure reali</h1>
    <pre id="log">Avvio…</pre>
    <script>
      (async () => {
        const out = document.querySelector("#log");
        const log = (x) => {
          out.textContent += "\n" + JSON.stringify(x);
        };
        const ids = [
          "tsunami_koh_lanta_thailand",
          "Tempe_Town_Lake_PSA",
          "TikTok-7605755333562158349",
        ];
        for (const id of ids) {
          try {
            let t = performance.now();
            const m = await (
              await fetch("https://archive.org/metadata/" + id, {
                signal: AbortSignal.timeout(15000),
              })
            ).json();
            log({ id, metadataMs: Math.round(performance.now() - t) });
            const f = m.files
              .filter(
                (f) => /\.mp4$/i.test(f.name) && +f.size < 8 * 1024 * 1024,
              )
              .sort((a, b) => +a.size - +b.size)[0];
            if (!f) continue;
            const url =
              "https://archive.org/cors/" +
              id +
              "/" +
              f.name.split("/").map(encodeURIComponent).join("/");
            const v = document.createElement("video");
            v.muted = true;
            v.playsInline = true;
            v.crossOrigin = "anonymous";
            v.preload = "auto";
            document.body.append(v);
            t = performance.now();
            v.src = url;
            await new Promise((ok, no) => {
              const timer = setTimeout(
                () => no(Error("timeout streaming")),
                25000,
              );
              v.onloadeddata = () => {
                clearTimeout(timer);
                ok();
              };
              v.onerror = () => {
                clearTimeout(timer);
                no(Error(v.error?.message));
              };
            });
            await v.play();
            const canvas = document.createElement("canvas");
            canvas.width = 8;
            canvas.height = 8;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(v, 0, 0, 8, 8);
            ctx.getImageData(0, 0, 1, 1);
            log({
              id,
              file: f.name,
              bytes: +f.size,
              duration: v.duration,
              streamFirstFrameMs: Math.round(performance.now() - t),
              frameReadable: true,
              bufferedSeconds: v.buffered.length ? v.buffered.end(0) : 0,
            });
            await new Promise((ok) => setTimeout(ok, 5000));
            log({
              id,
              streamAfter5s: {
                time: v.currentTime,
                bufferedEnd: v.buffered.length
                  ? v.buffered.end(v.buffered.length - 1)
                  : 0,
              },
            });
            v.pause();
            v.removeAttribute("src");
            v.load();
            v.remove();
            t = performance.now();
            const r = await fetch(url + "?probe=full-" + Date.now(), {
              signal: AbortSignal.timeout(90000),
            });
            if (!r.ok) throw Error("HTTP " + r.status);
            const b = await r.blob();
            log({
              id,
              fullDownloadMs: Math.round(performance.now() - t),
              bytes: b.size,
            });
          } catch (e) {
            log({ id, error: e.message });
          }
        }
        log({ done: true });
      })();
    </script>
  </body>
</html>

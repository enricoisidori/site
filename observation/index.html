<!doctype html>
<html lang="it">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>observation</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      font: 12px/1.5 monospace;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      visibility: hidden;
    }
    video.active {
      visibility: visible;
    }
    #loading {
      background: #000;
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: #888;
    }
    #loading[hidden],
    #words[hidden],
    #info[hidden] {
      display: none;
    }
    #words {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
      font: clamp(22px, 4vw, 64px)/1.2 sans-serif;
      padding: 8vw;
    }
    #info {
      position: fixed;
      left: 16px;
      top: 16px;
      max-width: min(680px, calc(100vw - 32px));
      max-height: 90vh;
      overflow: auto;
      background: #000d;
      padding: 16px;
      white-space: pre-wrap;
    }
    #info h2 {
      font: bold 12px monospace;
      margin: 20px 0 8px;
    }
    #info p {
      margin: 8px 0;
    }
    #info ol,
    #info ul {
      padding-left: 20px;
    }
    #info li {
      margin: 8px 0;
    }
    #info code {
      overflow-wrap: anywhere;
    }
    mark {
      background: #fff;
      color: #000;
    }
    a {
      color: inherit;
    }
  </style>

  <div id="loading" role="status">ricerca primo video…</div>
  <div id="words" hidden></div>
  <div id="info" hidden></div>
  <script id="vision-source" type="application/json">"import {\n  pipeline,\n  env,\n  RawImage,\n} from \"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2\";\nenv.allowLocalModels = false;\nenv.backends.onnx.wasm.numThreads = 1;\nlet model;\nself.onmessage = async ({ data }) => {\n  try {\n    model ||= await pipeline(\n      \"image-to-text\",\n      \"Xenova/vit-gpt2-image-captioning\",\n      {\n        dtype: \"q8\",\n        device: \"wasm\",\n        progress_callback: (p) => self.postMessage({ progress: p }),\n      },\n    );\n    const start = performance.now();\n    const result = await model(\n      new RawImage(\n        new Uint8ClampedArray(data.pixels),\n        data.width,\n        data.height,\n        4,\n      ),\n      { max_new_tokens: 28, num_beams: 1, do_sample: false },\n    );\n    self.postMessage({\n      caption: result[0].generated_text,\n      ms: performance.now() - start,\n    });\n  } catch (e) {\n    self.postMessage({ error: e.message });\n  }\n};\n"</script>
<script>
(async () => {
const loading = document.querySelector("#loading");
const words = document.querySelector("#words");
const info = document.querySelector("#info");
const LIMIT = 6 * 1024 * 1024;
const TARGET = 60;
let current = null,
  next = null,
  preparing = false,
  switching = false,
  worker;
let caption = "",
  terms = [],
  flow = null,
  retryTimer;
const rejected = new Set();
function readSeen() {
  try {
    const value = JSON.parse(
      sessionStorage.getItem("observation.seen") || "[]",
    );
    return Array.isArray(value) ? value : [];
  } catch {
    return [];
  }
}
const seen = new Set(readSeen());
function saveSeen() {
  try {
    sessionStorage.setItem("observation.seen", JSON.stringify([...seen]));
  } catch {}
}
const startedAt = performance.now();
const state = {
  status: "ricerca primo video",
  transitions: 0,
  history: [],
  timings: [],
  error: null,
  model: null,
  retries: 0,
};
const escape = (s) =>
  String(s ?? "").replace(
    /[&<>"']/g,
    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        c
      ],
  );
const text = (v) =>
  (Array.isArray(v) ? v.join(" · ") : String(v || ""))
    .replace(/<[^>]*>/g, " ")
    .replace(/\s+/g, " ")
    .trim();
const ms = (n) =>
  n == null
    ? "—"
    : `${Math.round(n).toLocaleString("it-IT")} ms (${(n / 1000).toFixed(2)} s)`;
const size = (n) => `${(n / 1024 / 1024).toFixed(2)} MiB`;
function highlighted(value, keys) {
  const source = String(value),
    at = keys.length
      ? source.search(new RegExp(`\\b(${keys.join("|")})\\b`, "i"))
      : 0;
  const begin = Math.max(0, at - 110),
    excerpt = source.slice(begin, begin + 550);
  const safe = escape(excerpt);
  return (
    (begin ? "…" : "") +
    (keys.length
      ? safe.replace(
          new RegExp(`\\b(${keys.join("|")})\\b`, "gi"),
          "<mark>$1</mark>",
        )
      : safe) +
    (source.length > begin + 550 ? "…" : "")
  );
}
const link = (c) =>
  c
    ? `<a href="https://archive.org/details/${encodeURIComponent(c.id)}" target="_blank" rel="noopener">${escape(c.title)}</a>`
    : "in attesa";
function ahead(v) {
  for (let i = 0; i < v.buffered.length; i++)
    if (
      v.buffered.start(i) <= v.currentTime + 0.15 &&
      v.buffered.end(i) > v.currentTime
    )
      return v.buffered.end(i) - v.currentTime;
  return 0;
}
function flowHTML(f) {
  if (!f)
    return "<p>Il primo video è scelto casualmente online, senza playlist.</p>";
  return `<ol><li>Video di partenza → ${link(f.source)}</li><li>Descrizione del fotogramma → ${escape(f.caption || "il modello sta descrivendo il video…")}</li><li>Keyword → <b>${escape(f.terms?.join(" · ") || "in attesa")}</b></li><li>Query Internet Archive → <code>${escape(f.query || "in attesa delle keyword")}</code></li><li>Nuovo video trovato → ${link(f.found)}${f.found?.match ? `<p>Riscontro in <b>${escape(f.found.match.field)}</b>: ${highlighted(f.found.match.text, f.terms)}</p><p>Parole della query effettivamente presenti: ${escape(f.found.match.hits.join(" · "))}</p>` : ""}${f.fallback ? "<p>Ricerca correlata fallita: nuovo casuale.</p>" : ""}</li><li>${f.switched ? "Cambio eseguito" : f.found?.ready ? "Video preparato; cambio al minuto o alla fine del video corrente" : "Preparazione del successore in corso"}</li></ol>`;
}
function mediaHTML(c, label) {
  if (!c) return "";
  const v = c.video;
  return `<p><b>${label}</b> · ${escape(c.title)}<br>File: ${escape(c.file)} · ${size(c.size)} dichiarati da Archive<br>Streaming: ${v.currentTime.toFixed(1)} / ${Number.isFinite(v.duration) ? v.duration.toFixed(1) : "—"} s · buffer davanti: ${ahead(v).toFixed(1)} s<br>Primo fotogramma dal caricamento URL: ${ms(c.firstFrameMs)} · preparazione: ${ms(c.prepareMs)}<br>Interruzioni per buffer: ${c.stalls || 0}${c.reducedBuffer ? " · buffer iniziale ridotto dopo attesa" : ""}</p>`;
}
function render() {
  words.textContent = terms.join(" ");
  const waiting = !current || current.video.ended;
  loading.hidden = !waiting;
  loading.textContent = state.error
    ? `attesa · ${state.error} · nuovo tentativo automatico`
    : state.status;
  if (
    waiting &&
    state.model?.status === "progress" &&
    state.model.progress != null
  )
    loading.textContent = `modello locale · ${Math.round(state.model.progress)}%`;
  if (info.hidden) return;
  info.innerHTML = `<b>observation · ${escape(state.status)}</b><p>Streaming · massimo ${size(LIMIT)} · un solo successore · cambi riusciti: ${state.transitions}</p><h2>Passaggio in corso</h2>${flowHTML(flow)}${state.history.length ? `<h2>Ultimo passaggio completato</h2>${flowHTML(state.history.at(-1))}` : ""}<h2>Riproduzione e caricamento</h2><p>Avvio totale della pagina → primo video: ${ms(state.firstPlaybackMs)}</p>${mediaHTML(current, "Video corrente")}${mediaHTML(next, "Successore")}${state.loadingMedia ? `<p>In preparazione: ${escape(state.loadingMedia.title)} · ${state.loadingMedia.buffer.toFixed(1)} s già caricati</p>` : ""}<p>La dimensione sopra è quella del file nei metadati, non i byte già scaricati. Il browser gestisce richieste parziali: il server non espone qui un conteggio affidabile dei byte trasferiti.</p><h2>Tempi: cosa significano</h2><p>1.000 ms = 1 secondo. Questi tempi misurano attese e lavoro, non la durata del video.<br>Ricerca: attesa della lista di risultati.<br>Metadati: attesa della scheda di un singolo candidato, con titolo, descrizione, soggetti e file; il nome indica quale video. Più righe significano più candidati controllati.<br>Modello: caricamento dei pesi (solo se necessario) e descrizione del fotogramma.<br>Primo fotogramma: apertura dell’URL, primi dati e decodifica.<br>Preparazione: tempo per raggiungere il buffer richiesto; può includere attesa della rete.</p><ul>${state.timings
    .slice(-12)
    .map(
      (t) =>
        `<li><b>${escape(t.label)}</b>: ${ms(t.ms)}${t.ok ? "" : " · tentativo fallito"}</li>`,
    )
    .join("")}</ul>${state.error ? `<p>${escape(state.error)}</p>` : ""}`;
}
function status(value) {
  state.status = value;
  render();
}
async function measured(label, fn) {
  const start = performance.now();
  let ok = false;
  try {
    const value = await fn();
    ok = true;
    return value;
  } finally {
    state.timings.push({ label, ms: performance.now() - start, ok });
    state.timings = state.timings.slice(-24);
    render();
  }
}
async function json(url) {
  let last;
  for (let i = 0; i < 2; i++) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(12000) });
      if (!r.ok) throw Error(`HTTP ${r.status}`);
      const data = await r.json();
      if (data.error) throw Error(data.error);
      return data;
    } catch (e) {
      last = e;
    }
  }
  throw last;
}
const base =
  'mediatype:movies AND -access-restricted-item:true AND format:(MPEG4 OR "h.264") AND item_size:[40000 TO 20000000]';
async function search(q, rows = 12, page = 1) {
  if (flow) {
    flow.query = q;
    flow.queries.push(q);
  }
  const url = new URL("https://archive.org/advancedsearch.php");
  url.search = new URLSearchParams({ q, output: "json", rows, page });
  for (const field of ["identifier", "title", "description", "subject"])
    url.searchParams.append("fl[]", field);
  render();
  return measured(
    `Ricerca · ${flow ? "successore correlato" : "primo video casuale"} · pagina ${page}`,
    () => json(url),
  );
}
function score(metadata, keys = terms) {
  let best = null,
    weight = 0;
  const covered = new Set();
  for (const [field, priority] of [
    ["title", 100],
    ["subject", 10],
    ["description", 1],
  ]) {
    const value = text(metadata[field]),
      hits = keys.filter((k) => new RegExp(`\\b${k}\\b`, "i").test(value));
    hits.forEach((k) => covered.add(k));
    weight += hits.length * priority;
    if (hits.length && (!best || hits.length * priority > best.score))
      best = { field, text: value, hits, score: hits.length * priority };
  }
  return { total: covered.size * 1000 + weight, best };
}
async function candidate(doc, related) {
  if (seen.has(doc.identifier) || rejected.has(doc.identifier)) return null;
  const m = await measured(
    `Metadati · ${text(doc.title) || doc.identifier}`,
    () =>
      json(
        "https://archive.org/metadata/" + encodeURIComponent(doc.identifier),
      ),
  );
  if (
    m.is_dark ||
    !m.metadata ||
    m.metadata["access-restricted-item"] === "true"
  )
    return null;
  const relation = score(m.metadata);
  if (related && !relation.total) return null;
  const files = (m.files || []).filter(
    (f) => /\.mp4$/i.test(f.name) && +f.size > 40000 && +f.size <= LIMIT,
  );
  // Lower bitrate matters for streaming; favour a derivative at equal bitrate.
  files.sort(
    (a, b) =>
      +a.size / (+a.length || 60) - +b.size / (+b.length || 60) ||
      (a.source === "derivative" ? -1 : 1),
  );
  if (!files.length) return null;
  const f = files[0];
  return {
    id: doc.identifier,
    title: text(m.metadata.title) || doc.identifier,
    file: f.name,
    size: +f.size,
    duration: +f.length || null,
    match: related ? relation.best : null,
    query: flow?.query || "",
    url: `https://archive.org/cors/${encodeURIComponent(doc.identifier)}/${f.name.split("/").map(encodeURIComponent).join("/")}`,
  };
}
async function pick(related) {
  status(related ? "ricerca correlata…" : "ricerca primo video…");
  const clauses = terms
    .slice(0, 4)
    .map((k) => `(title:${k} OR subject:${k} OR description:${k})`);
  const titleClauses = terms
    .slice(0, 4)
    .map((k) => `(title:${k} OR subject:${k})`);
  const minute = 'runtime:"00:01:00"';
  const queries = related
    ? [
        ...new Set([
          `${base} AND (${clauses.join(" AND ")})`,
          `${base} AND (${titleClauses.join(" OR ")})`,
          `${base} AND (${clauses.join(" OR ")})`,
        ]),
      ]
    : [
        `mediatype:movies AND item_size:[40000 TO ${LIMIT}] AND ${minute}`,
        `${base} AND ${minute}`,
        base,
      ];
  for (const q of queries) {
    // Shuffle a live result page: no count-only or empty-page round trip.
    let data;
    try {
      data = await search(
        q,
        related ? 18 : 24,
        1,
      );
    } catch (e) {
      state.lastError = e.message;
      continue;
    }
    if (!data.response?.numFound) continue;
    if (!data.response.docs.length && !related) data = await search(q, 12, 1);
    const docs = data.response.docs.filter(
      (d) => !seen.has(d.identifier) && !rejected.has(d.identifier),
    );
    if (related) docs.sort((a, b) => score(b).total - score(a).total);
    else docs.sort(() => Math.random() - 0.5);
    // Search already supplies the text fields; resolve the best candidates only,
    // stop as soon as one has verified metadata and a suitable file.
    for (const doc of docs.slice(0, 4)) {
      try {
        const c = await candidate(doc, related);
        if (c) return c;
      } catch (e) {
        state.lastError = e.message;
      }
    }
  }
  return null;
}
function release(c) {
  if (!c?.video) return;
  c.video.pause();
  c.video.removeAttribute("src");
  c.video.load();
  c.video.remove();
}
async function preload(c, initial = false) {
  const v = document.createElement("video");
  v.muted = true;
  v.playsInline = true;
  v.preload = "auto";
  v.crossOrigin = "anonymous";
  v.loop = false;
  c.video = v;
  c.stalls = 0;
  document.body.prepend(v);
  const start = performance.now();
  state.loadingMedia = { title: c.title, buffer: 0 };
  status(initial ? "apertura primo video…" : "preparazione successore…");
  try {
    await new Promise((resolve, reject) => {
      let settled = false;
      function finish(error) {
        if (settled) return;
        settled = true;
        clearInterval(poll);
        clearTimeout(timer);
        v.removeEventListener("error", failed);
        if (error) reject(error);
        else resolve();
      }
      function failed() {
        finish(Error(v.error?.message || "video non riproducibile"));
      }
      function check() {
        const buffer = ahead(v);
        state.loadingMedia = { title: c.title, buffer };
        if (v.readyState >= 2 && c.firstFrameMs == null) {
          c.firstFrameMs = performance.now() - start;
          render();
        }
        const required = initial
          ? 0
          : Math.min(2, Math.max(0.1, v.duration - 0.1));
        if (v.readyState >= 2 && (initial || buffer >= required)) finish();
        render();
      }
      const poll = setInterval(check, 150);
      const timer = setTimeout(() => {
        if (v.readyState >= 2 && ahead(v) >= 1) {
          c.reducedBuffer = true;
          finish();
        } else finish(Error("nessun fotogramma ricevuto entro 20 s"));
      }, 20000);
      v.addEventListener("error", failed);
      v.src = c.url;
      v.load();
    });
    c.prepareMs = performance.now() - start;
    c.ready = true;
    state.timings.push({
      label: `Primo fotogramma · ${c.title}`,
      ms: c.firstFrameMs,
      ok: true,
    });
    state.timings.push({
      label: `Preparazione buffer · ${c.title}`,
      ms: c.prepareMs,
      ok: true,
    });
    v.addEventListener("timeupdate", () => {
      if (current !== c) return;
      if (
        v.currentTime >= Math.min(3, v.duration / 3) &&
        !preparing &&
        !next &&
        !state.error
      )
        prepare();
      maybeSwitch();
    });
    v.addEventListener("ended", () => {
      if (current === c) {
        if (next) maybeSwitch();
        else {
          status("attendo il successore…");
          if (!preparing) prepare();
        }
      }
    });
    v.addEventListener("waiting", () => {
      if (current === c && !v.ended) {
        c.stalls++;
        render();
      }
    });
    v.addEventListener("error", () => {
      if (current === c) fail(Error(v.error?.message || "stream interrotto"));
    });
    return c;
  } catch (e) {
    release(c);
    throw e;
  } finally {
    state.loadingMedia = null;
    render();
  }
}
async function loadCandidate(related, initial = false) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const c = await pick(related);
    if (!c) return null;
    if (flow) {
      flow.found = c;
      render();
    }
    try {
      return await preload(c, initial);
    } catch (e) {
      rejected.add(c.id);
      state.lastError = `${c.title}: ${e.message}`;
    }
  }
  return null;
}
function infer() {
  return new Promise((resolve, reject) => {
    if (!worker) {
      const source = JSON.parse(
        document.querySelector("#vision-source").textContent,
      );
      const url = URL.createObjectURL(
        new Blob([source], { type: "text/javascript" }),
      );
      worker = new Worker(url, { type: "module" });
      URL.revokeObjectURL(url);
    }
    const canvas = document.createElement("canvas"),
      v = current.video;
    canvas.width = 384;
    canvas.height = Math.max(
      1,
      Math.round((384 * v.videoHeight) / v.videoWidth),
    );
    const ctx = canvas.getContext("2d");
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const timer = setTimeout(() => {
      worker.terminate();
      worker = null;
      reject(Error("modello locale: attesa oltre 4 minuti"));
    }, 240000);
    worker.onmessage = ({ data }) => {
      if (data.progress) {
        state.model = data.progress;
        render();
        return;
      }
      clearTimeout(timer);
      data.error ? reject(Error(data.error)) : resolve(data);
    };
    worker.onerror = (e) => {
      clearTimeout(timer);
      reject(Error(e.message || "modello locale non disponibile"));
    };
    worker.postMessage(
      { pixels: pixels.buffer, width: canvas.width, height: canvas.height },
      [pixels.buffer],
    );
  });
}
const stop = new Set(
  "a an the is are of in on at to with and it there this that some his her its for from by as near next standing sitting walking image picture photo view looking wearing has have seen front back background foreground behind beside above below outside inside black white red blue green yellow small large big old young holding hanging".split(
    " ",
  ),
);
async function prepare() {
  if (preparing || next || !current) return;
  preparing = true;
  clearTimeout(retryTimer);
  state.error = null;
  try {
    if (flow?.source.id !== current.id) {
      flow = {
        source: { id: current.id, title: current.title },
        caption: "",
        terms: [],
        query: "",
        queries: [],
        found: null,
      };
      caption = "";
      terms = [];
    }
    if (!flow.caption) {
      status("descrizione locale del fotogramma…");
      const result = await measured(`Modello locale · ${current.title}`, infer);
      caption = result.caption;
      terms = [...new Set(caption.toLowerCase().match(/[a-z]{3,}/g) || [])]
        .filter((k) => !stop.has(k))
        .slice(0, 6);
      const specific = terms.filter(
        (k) => !["man", "woman", "person", "people"].includes(k),
      );
      if (specific.length) terms = specific;
      flow.caption = caption;
      flow.terms = [...terms];
      flow.inferenceMs = result.ms;
      render();
    }
    next = terms.length ? await loadCandidate(true) : null;
    if (!next) {
      flow.fallback = true;
      next = await loadCandidate(false);
    }
    if (!next) throw Error("nessun nuovo candidato riproducibile");
    status("successore pronto");
    maybeSwitch();
  } catch (e) {
    fail(e);
  } finally {
    preparing = false;
  }
}
async function activate(c) {
  if (switching) return;
  switching = true;
  const old = current;
  try {
    await c.video.play();
    // Present the new decoded frame before removing the old player.
    c.video.classList.add("active");
    current = c;
    next = null;
    if (!old) state.firstPlaybackMs = performance.now() - startedAt;
    seen.add(c.id);
    saveSeen();
    state.error = null;
    state.retries = 0;
    if (old) {
      if (flow) {
        flow.switched = true;
        flow.at = new Date().toISOString();
        state.history.push({
          ...flow,
          found: { id: c.id, title: c.title, match: c.match },
        });
        state.history = state.history.slice(-3);
      }
      state.transitions++;
      release(old);
    }
    flow = null;
    caption = "";
    terms = [];
    status("riproduzione");
  } catch (e) {
    fail(e);
  } finally {
    switching = false;
  }
}
function maybeSwitch() {
  if (
    !switching &&
    next &&
    current &&
    (current.video.currentTime >= TARGET || current.video.ended)
  )
    activate(next);
}
function fail(e) {
  state.error = e.message;
  state.retries++;
  status("attesa rete o modello…");
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    state.error = null;
    current ? prepare() : start();
  }, 15000);
}
async function start() {
  try {
    state.error = null;
    const first = await loadCandidate(false, true);
    if (!first) throw Error("nessun primo video disponibile");
    await activate(first);
  } catch (e) {
    fail(e);
  }
}
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const key = e.key.toLowerCase();
  if (key === "i") {
    info.hidden = !info.hidden;
    render();
  }
  if (key === "w") {
    words.hidden = !words.hidden;
    render();
  }
});
document.addEventListener("pointerdown", () => {
  if (current?.video.paused && !current.video.ended)
    current.video.play().catch(() => {});
});
setInterval(render, 1000);
// Startup deliberately does not wait for the vision model.
await start();

})();
</script>

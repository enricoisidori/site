<!doctype html><meta charset="utf-8" /><title>Observation · misure</title
><style>
  body {
    background: #111;
    color: #ddd;
    font: 14px monospace;
    white-space: pre-wrap;
  }
  video {
    width: 320px;
  }
</style>
<body>
  Misure browser in corso…
  <script type="module">
    const log = (x) =>
      document.body.append(document.createTextNode("\n" + JSON.stringify(x)));
    const start = performance.now();
    try {
      const u = new URL("https://archive.org/advancedsearch.php");
      u.search = new URLSearchParams({
        q: 'mediatype:movies AND (runtime:"00:01:00" OR runtime:"00:00:60" OR runtime:"00:01:01")',
        output: "json",
        rows: 12,
        "fl[]": "identifier",
        sort: "downloads desc",
      });
      const r = await fetch(u);
      const j = await r.json();
      log({ searchMs: performance.now() - start, result: j });
      for (const d of j.response.docs) {
        const t = performance.now();
        const m = await (
          await fetch("https://archive.org/metadata/" + d.identifier)
        ).json();
        log({
          metadataMs: performance.now() - t,
          id: d.identifier,
          title: m.metadata.title,
          files: m.files
            .filter((f) => /\.mp4$/i.test(f.name))
            .map((f) => ({ name: f.name, size: f.size, length: f.length })),
        });
        const f = m.files
          .filter((f) => /\.mp4$/i.test(f.name) && +f.size < 20000000)
          .sort((a, b) => a.size - b.size)[0];
        if (!f) continue;
        const url =
          "https://archive.org/cors/" +
          d.identifier +
          "/" +
          f.name.split("/").map(encodeURIComponent).join("/");
        const v = document.createElement("video");
        v.muted = true;
        v.autoplay = true;
        v.crossOrigin = "anonymous";
        document.body.append(v);
        let s = performance.now();
        v.src = url;
        await new Promise((ok, no) => {
          v.onplaying = ok;
          v.onerror = () => ok();
          setTimeout(ok, 15000);
        });
        log({
          streamPlayingMs: performance.now() - s,
          mediaError: v.error?.message,
          url,
        });
        s = performance.now();
        const b = await (await fetch(url)).blob();
        log({ fullDownloadMs: performance.now() - s, bytes: b.size });
        v.src = URL.createObjectURL(b);
        await v.play();
        log({ blobPlaying: true });
        break;
      }
    } catch (e) {
      log({ error: String(e) });
    }
  </script>
</body>
